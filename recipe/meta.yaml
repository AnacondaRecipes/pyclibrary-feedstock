{% set name = "PyClibrary" %}
{% set version = "0.4.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name|lower }}-{{ version }}.tar.gz
  sha256: 5c33fd723d79b5f77f442c26fa0fb50786813622f037515864313caad9705760

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - setuptools-scm
    - hatchling
    - hatch-vcs
  run:
    - python
    - pyparsing >=2.3.1,<4

test:
  imports:
    - pyclibrary
    - pyclibrary.backends
  commands:
    - pip check
  requires:
    - python
    - pip

about:
  home: https://github.com/MatthieuDartiailh/pyclibrary
  dev_url: https://github.com/MatthieuDartiailh/pyclibrary
  doc_url: https://pyclibrary.readthedocs.io
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: C parser and ctypes automation for Python
  description: |
    PyCLibrary includes 1) a pure-python C parser and 2) an automation library
    that uses C header file definitions to simplify the use of C bindings.











extra:
  recipe-maintainers:
    - jakirkham
    - BastianZim
